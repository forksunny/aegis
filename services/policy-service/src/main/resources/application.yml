server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: policy-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/aegis_policy?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:aegis_policy}
    password: ${DB_PASSWORD:aegis_policy_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

aegis:
  quote-service:
    base-url: ${QUOTE_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
