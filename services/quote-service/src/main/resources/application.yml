server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: quote-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/aegis_quote?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:aegis_quote}
    password: ${DB_PASSWORD:aegis_quote_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always